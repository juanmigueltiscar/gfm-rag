[project]
name = "gfmrag"
version = "2.0.0"
description = "Graph Foundation Model for Retrieval Augmented Generation"
authors = [
    {name = "Linhao Luo", email = "linhao.luo@monash.edu"},
    {name = "Zicheng Zhao", email = "zicheng.zhao@njust.edu.cn"},
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9.0",
    "torch-geometric>=2.4.0,<3.0.0",
    "ninja>=1.11.1.1,<2.0.0",
    "easydict>=1.13,<2.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "tqdm>=4.66.5,<5.0.0",
    "sentence-transformers>=3.4.1",
    "hydra-core>=1.3.2,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "wandb>=0.18.5,<0.19.0",
    "transformers>=4.52.4,<5.0.0",
    "openai>=2.29.0,<3.0.0",
    "tiktoken>=0.8.0,<0.9.0",
    "langchain>=0.3.9,<0.4.0",
    "langchain-openai>=0.3.33,<0.4.0",
    "langchain-together>=0.3.1,<0.4.0",
    "langchain-community>=0.3.9,<0.4.0",
    "langchain-nvidia-ai-endpoints>=0.3.9,<0.4.0",
    "pymetis>=2025.2.2,<2026.0.0",
]

[project.optional-dependencies]
full = [
    "vllm>=0.11.0,<0.12.0",
    "pylate>=1.4.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1,<5.0.0",
    "types-pyyaml>=6.0.12.20240917,<7.0.0",
    "mypy>=1.12.1,<2.0.0",
    "pytest>=8.3.3,<9.0.0",
]
doc = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocstrings>=0.27.0,<0.28.0",
    "mkdocstrings-python>=1.13.0,<2.0.0",
    "mkdocs-autorefs>=1.3.0,<2.0.0",
    "mkdocs-material>=9.5.50,<10.0.0",
    "mkdocs-same-dir>=0.1.3,<0.2.0",
    "mike>=2.1.3,<3.0.0",
]
tests = [
    "pandas>=2.2.0,<4.0.0",
    "datasets>=2.14.0,<5.0.0",
    "einops>=0.8.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gfmrag"]

[tool.ruff]
exclude = ['gfmrag/models/ultra']

[tool.ruff.lint]
extend-select = ["I", "N", "UP", "B", "PD002"]
extend-ignore = ["E501", "E203", "E266"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" =  ["F401"]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
